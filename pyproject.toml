[project]
name = "meobot"
version = "0.6.0a3.post1"
description = "MeoBot - Telegram-first AI operations assistant for a media team"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "MeoBot Team" }]

dependencies = [
    # Web / API
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    # Telegram
    "aiogram>=3.15.0,<3.22.0",
    # Configuration & validation
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<0.31.0",
    "alembic>=1.14.0,<1.17.0",
    # Cache / broker
    "redis>=5.2.0,<6.0.0",
    "celery[redis]>=5.4.0,<5.6.0",
    # HTTP
    "httpx>=0.27.0,<0.29.0",
    "google-auth>=2.35.0,<3.0.0",
    # Secrets that must live in the database and be read back - today, exactly
    # one thing: a channel connector's OAuth refresh token. Step 1F.2.4b.
    # Already present transitively; declared directly because the code now
    # imports it, and a transitive dependency is not a promise.
    "cryptography>=44.0.0,<50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.2.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "ruff>=0.8.0,<0.14.0",
    "mypy>=1.13.0,<2.0.0",
    "celery-types>=0.22.0,<0.24.0",
]

[project.scripts]
meobot-bot = "meobot.bot.main:run"
# Step 1F.1 policy ingestion and pack activation. Operations only - see
# src/meobot/cli/policy.py on why this is a shell command and not a capability.
meobot-policy = "meobot.cli.policy:main"
# Step 1F.2.4d. Read-only capability probing against a connected Facebook Page.
# Operations only, and for the same reason as above: the answer is a table of
# Graph metric names, which is an engineering artefact rather than a screen.
meobot-meta-probe = "meobot.cli.meta_probe:main"
# M2.5. Seeds the work-type taxonomy into a deployment whose
# ``pr_work_types`` is still empty - the state that leaves "Giao công việc"
# with nothing to choose. The same service method the API route uses, for the
# case where nobody can reach that route yet. Idempotent.
meobot-work-types = "meobot.cli.work_types:main"
# Step 1F.2.6. Read-only capability probing against a connected TikTok account.
# Unlike the Meta probe this is not a diagnostic for a card that is already
# blank - it is the precondition for building any TikTok card at all, because
# whether the Display API serves per-video counters to this app is not a
# question documentation can settle.
meobot-tiktok-probe = "meobot.cli.tiktok_probe:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meobot"]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.2.0",
    "pytest-cov>=6.0.0,<8.0.0",
    "ruff>=0.8.0,<0.14.0",
    "mypy>=1.13.0,<2.0.0",
    "celery-types>=0.22.0,<0.24.0",
    "aiosqlite>=0.20.0,<0.22.0",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format + import sorting)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez (no naive datetimes)
    "T20",  # flake8-print (no stray print)
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # bandit
]
ignore = [
    "S101",  # assert is fine (pytest)
    "B008",  # FastAPI Depends() in defaults is idiomatic
]
# Button labels are Vietnamese UI text; these glyphs are chosen, not mistyped.
# Button labels and Vietnamese prose use these glyphs deliberately.
allowed-confusables = ["➕", "✚", "－", "‘", "’", "“", "”"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
# An operator CLI's whole job is to print. Routing it through the structured
# logger would put its output in the log stream rather than the operator's
# terminal, which is the opposite of what a command-line tool is for.
"src/meobot/cli/**" = ["T201"]
# Same reasoning for the operator smoke scripts: their output is a report an
# operator reads on a terminal, not a log line.
"scripts/**" = ["T201"]
"alembic/**" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["meobot"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["meobot"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that require a live PostgreSQL/Redis (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:meobot.*"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/meobot"]
branch = true
omit = ["*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
