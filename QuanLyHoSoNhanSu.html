<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý hồ sơ nhân sự — Công ty CP ABC</title>
<style>
/* ============ QUẢN LÝ HỒ SƠ NHÂN SỰ — stylesheet ============ */
:root{
  --blue:#1565d8; --blue-d:#0f4fb0; --blue-l:#e8f1fd;
  --ink:#1b2733; --ink-2:#5a6b7b; --ink-3:#8c9aa8;
  --line:#e3e8ef; --line-2:#eef1f5; --bg:#f4f6f9; --card:#fff;
  --green:#19a974; --green-l:#e6f7f0;
  --amber:#e8930c; --amber-l:#fdf3e2;
  --red:#e0384d;  --red-l:#fdeaec;
  --violet:#7a4ddb; --violet-l:#f1ebfd;
  --r:8px; --sh:0 1px 2px rgba(27,39,51,.06),0 2px 8px rgba(27,39,51,.05);
  --sh-lg:0 8px 32px rgba(27,39,51,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font:13px/1.5 "Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}

/* ---------- layout ---------- */
.demo-banner{
  background:#fff8e1;border-bottom:1px solid #f0dca8;color:#7a5a00;
  padding:6px 16px;font-size:12px;display:flex;gap:10px;align-items:center;
}
.layout{display:flex;height:calc(100vh - 31px)}
.sidebar{
  width:224px;flex:0 0 224px;background:#0e2033;color:#c7d3e0;
  display:flex;flex-direction:column;overflow-y:auto;
}
.brand{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid #1d324a}
.brand-mark{
  width:34px;height:34px;border-radius:7px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.5px;
}
.brand-name{font-weight:600;color:#fff;font-size:14px}
.brand-sub{font-size:11px;color:#7b8ea3}
nav{padding:8px 0;flex:1}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#6b7f94;padding:14px 16px 6px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;
  padding:8px 16px;text-align:left;color:#c7d3e0;cursor:pointer;font-size:13px;
  border-left:3px solid transparent;
}
.nav-item:hover{background:#17293d;color:#fff}
.nav-item.active{background:#17293d;color:#fff;border-left-color:var(--blue);font-weight:500}
.nav-item .ico{width:16px;text-align:center;opacity:.85;font-size:14px}
.nav-item em{
  margin-left:auto;font-style:normal;background:#294256;color:#dbe6f0;
  border-radius:9px;padding:1px 7px;font-size:11px;
}
.sidebar-foot{padding:12px 16px;font-size:11px;color:#5f7489;border-top:1px solid #1d324a}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{
  height:52px;flex:0 0 52px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px;
}
.topbar h1{font-size:16px;font-weight:600;margin:0}
.topbar .crumb{font-size:12px;color:var(--ink-3)}
.spacer{flex:1}
.avatar-me{
  width:30px;height:30px;border-radius:50%;background:var(--violet-l);color:var(--violet);
  display:grid;place-items:center;font-weight:600;font-size:12px;
}
.content{flex:1;overflow-y:auto;padding:16px 18px 40px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:6px;padding:6px 11px;cursor:pointer;color:var(--ink);white-space:nowrap;
}
.btn:hover{border-color:#c6d0dc;background:#fafbfc}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.btn-primary:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn-danger{color:var(--red);border-color:#f2c3c9}
.btn-danger:hover{background:var(--red-l)}
.btn-sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline}
.icon-btn{
  background:none;border:0;cursor:pointer;color:var(--ink-2);padding:4px 6px;border-radius:5px;font-size:14px;
}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}

/* ---------- cards / panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.panel-hd{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2);
}
.panel-hd h3{margin:0;font-size:13.5px;font-weight:600}
.panel-bd{padding:14px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{position:relative;flex:0 0 280px}
.search input{
  width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:6px;background:#fff;
}
.search input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.search .mag{position:absolute;left:9px;top:6px;color:var(--ink-3)}
select.f,input.f{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;max-width:170px}
select.f:focus,input.f:focus{outline:0;border-color:var(--blue)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--blue-l);color:var(--blue-d);
  border-radius:20px;padding:3px 6px 3px 10px;font-size:12px;
}
.chip button{background:none;border:0;cursor:pointer;color:inherit;font-size:14px;line-height:1;opacity:.7}
.chip button:hover{opacity:1}

/* ---------- table ---------- */
.tbl-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{
  position:sticky;top:0;z-index:2;background:#f7f9fb;text-align:left;font-weight:600;color:var(--ink-2);
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover{color:var(--blue)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:#f9fbfd}
tbody tr.sel{background:var(--blue-l)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.sticky-l{position:sticky;left:0;background:inherit;z-index:1}
thead .sticky-l{z-index:3;background:#f7f9fb}
tbody tr:hover .sticky-l{background:#f9fbfd}
tbody tr.sel .sticky-l{background:var(--blue-l)}
.c-check{width:34px}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3)}

.emp-cell{display:flex;align-items:center;gap:9px;min-width:190px}
.ava{
  width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;
  font-size:11px;font-weight:600;color:#fff;
}
.emp-name{font-weight:500;color:var(--ink)}
.emp-name:hover{color:var(--blue);cursor:pointer;text-decoration:underline}
.emp-code{font-size:11px;color:var(--ink-3)}

.tag{
  display:inline-block;padding:1.5px 8px;border-radius:12px;font-size:11.5px;font-weight:500;white-space:nowrap;
}
.t-green{background:var(--green-l);color:#0f7a54}
.t-amber{background:var(--amber-l);color:#9a6000}
.t-red{background:var(--red-l);color:#b3202f}
.t-blue{background:var(--blue-l);color:var(--blue-d)}
.t-violet{background:var(--violet-l);color:#5b31b0}
.t-grey{background:#eef1f5;color:var(--ink-2)}

/* ---------- pagination / bulk bar ---------- */
.pager{display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:12.5px;color:var(--ink-2)}
.pager .pg{display:flex;gap:4px;margin-left:auto}
.pg button{
  min-width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;
}
.pg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pg button[disabled]{opacity:.4;cursor:not-allowed}
.bulkbar{
  position:sticky;bottom:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:#0e2033;color:#fff;border-radius:var(--r);padding:9px 14px;margin-top:10px;box-shadow:var(--sh-lg);
}
.bulkbar b{font-weight:600}
.bulkbar .btn{background:#20374f;border-color:#2d4a67;color:#fff}
.bulkbar .btn:hover{background:#2a4661}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh)}
.kpi .lbl{font-size:12px;color:var(--ink-2)}
.kpi .val{font-size:24px;font-weight:600;margin-top:3px;line-height:1.1}
.kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px}
.bar-row .nm{flex:0 0 150px;color:var(--ink-2)}
.bar-track{flex:1;height:18px;background:var(--line-2);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--blue);border-radius:4px}
.bar-row .n{flex:0 0 32px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.list-lite{margin:0;padding:0;list-style:none}
.list-lite li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.list-lite li:last-child{border-bottom:0}
.list-lite .meta{margin-left:auto;font-size:11.5px;color:var(--ink-3);text-align:right}

/* ---------- drawer (hồ sơ chi tiết) ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,32,51,.42);z-index:40;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(1080px,96vw);background:var(--bg);
  z-index:41;display:flex;flex-direction:column;box-shadow:var(--sh-lg);animation:slide .18s ease-out;
}
@keyframes slide{from{transform:translateX(30px);opacity:.6}}
.dw-hd{background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.dw-hd .ava{width:52px;height:52px;flex:0 0 52px;font-size:17px}
.dw-hd h2{margin:0 0 3px;font-size:17px;font-weight:600}
.dw-meta{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px}
.dw-tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:2px;overflow-x:auto;padding:0 10px}
.dw-tabs button{
  background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;
  color:var(--ink-2);white-space:nowrap;font-size:12.5px;
}
.dw-tabs button:hover{color:var(--blue)}
.dw-tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:500}
.dw-bd{flex:1;overflow-y:auto;padding:14px 18px 40px}

.fieldset{margin-bottom:14px}
.fieldset > h4{
  margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);
  padding-bottom:6px;border-bottom:1px solid var(--line-2);
}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px 24px}
.kv .row{display:flex;gap:10px;padding:6px 0;font-size:12.5px;border-bottom:1px dotted var(--line)}
.kv .k{flex:0 0 140px;color:var(--ink-2)}
.kv .v{flex:1;font-weight:500;word-break:break-word}
.kv .v.muted{font-weight:400;color:var(--ink-3)}

/* ---------- modal ---------- */
.modal{
  position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(880px,94vw);max-height:90vh;background:#fff;border-radius:10px;box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;animation:pop .14s ease-out;
}
@keyframes pop{from{transform:translate(-50%,-48%) scale(.97);opacity:.5}}
.modal.sm{width:min(520px,94vw)}
.md-hd{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.md-hd h3{margin:0;font-size:15px;font-weight:600}
.md-bd{padding:16px 18px;overflow-y:auto}
.md-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fafbfc;border-radius:0 0 10px 10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--ink-2)}
.fld label .req{color:var(--red)}
.fld input,.fld select,.fld textarea{
  padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.fld .err{font-size:11.5px;color:var(--red)}
.fld.bad input,.fld.bad select{border-color:var(--red)}
.fld.wide{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--ink-3)}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-3);margin:16px 0 8px}
.sec-title:first-child{margin-top:0}

/* ---------- misc ---------- */
.toast-box{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#0e2033;color:#fff;padding:10px 14px;border-radius:7px;box-shadow:var(--sh-lg);
  font-size:12.5px;animation:pop .15s;max-width:340px;
}
.toast.ok{background:#0f7a54}
.toast.err{background:#b3202f}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ecard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh);cursor:pointer}
.ecard:hover{border-color:var(--blue);box-shadow:0 4px 14px rgba(21,101,216,.14)}
.ecard .ava{width:56px;height:56px;flex:none;margin:0 auto 9px;font-size:18px}
.ecard .n{font-weight:600;font-size:13px}
.ecard .p{font-size:12px;color:var(--ink-2);margin:2px 0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{background:none;border:0;padding:6px 10px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--blue);color:#fff}
.col-pick{max-height:280px;overflow:auto}
.col-pick label{display:flex;gap:8px;align-items:center;padding:5px 2px;font-size:12.5px;cursor:pointer}
.orgtree{font-size:12.5px}
.orgtree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed var(--line)}
.orgtree > ul{padding-left:0;border:0}
.orgtree li{padding:4px 0}
.org-node{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.org-node .ava{width:24px;height:24px;flex:0 0 24px;font-size:10px}
.dept-n{font-weight:600}
.timeline{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 14px}
.timeline li::before{
  content:"";position:absolute;left:-23px;top:4px;width:9px;height:9px;border-radius:50%;
  background:#fff;border:2px solid var(--blue);
}
.timeline .ttl{font-weight:600;font-size:12.5px}
.timeline .dt{font-size:11.5px;color:var(--ink-3)}
.timeline .ds{font-size:12.5px;color:var(--ink-2)}
@media print{
  .sidebar,.topbar,.demo-banner,.toolbar,.bulkbar,.dw-tabs,.md-ft{display:none!important}
  .drawer,.scrim{position:static;width:auto;box-shadow:none}
  body{background:#fff}
}

</style>
</head>
<body>

<div class="demo-banner">
  <span><b>BẢN DEMO</b> — không có đăng nhập/phân quyền thật, dữ liệu lưu trong trình duyệt (localStorage).</span>
  <span class="spacer"></span>
  <button id="btn-reset" class="link-btn">Xóa dữ liệu thử &amp; nạp lại mẫu</button>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ABC</div>
      <div>
        <div class="brand-name">Thông tin nhân sự</div>
        <div class="brand-sub">Công ty CP ABC</div>
      </div>
    </div>
    <nav>
      <button class="nav-item" data-view="tongquan"><span class="ico">▦</span><span>Tổng quan</span></button>

      <div class="nav-group">Hồ sơ nhân sự</div>
      <button class="nav-item" data-view="hoso"><span class="ico">▤</span><span>Quản lý hồ sơ</span><em id="badge-nv"></em></button>
      <button class="nav-item" data-view="duyet"><span class="ico">✓</span><span>Duyệt hồ sơ</span><em id="badge-duyet"></em></button>

      <div class="nav-group">Tổ chức</div>
      <button class="nav-item" data-view="sodo"><span class="ico">⎔</span><span>Sơ đồ tổ chức</span></button>

      <div class="nav-group">Hệ thống</div>
      <button class="nav-item" data-view="danhmuc"><span class="ico">⚙</span><span>Danh mục &amp; thiết lập</span></button>
    </nav>
    <div class="sidebar-foot">Demo v1.0 · Bộ luật Lao động 2019</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Tổng quan nhân sự</h1>
        <div class="crumb" id="crumb">Thông tin nhân sự</div>
      </div>
      <span class="spacer"></span>
      <span class="hint">Kỳ dữ liệu: 09/11/2026</span>
      <div class="avatar-me" title="Trần Thị Emma — Trưởng phòng HCNS">ET</div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>

<script>

  hinhThucKT: ['Tiền thưởng','Giấy khen','Bằng khen','Nâng bậc lương trước hạn'],
};

const HO = ['Nguyễn','Trần','Lê','Phạm','Hoàng','Vũ','Đặng','Bùi','Đỗ','Hồ','Ngô','Dương','Lý','Phan','Võ'];
const DEM_NAM = ['Văn','Hữu','Đức','Minh','Quang','Thành','Tuấn','Xuân','Bá','Trọng'];
const DEM_NU  = ['Thị','Thu','Thanh','Ngọc','Khánh','Mai','Hồng','Diệu','Phương','Kiều'];
const TEN_NAM = ['An','Bình','Cường','Dũng','Đạt','Hải','Hùng','Khoa','Long','Nam','Phúc','Quân','Sơn','Tài','Thắng','Trung','Tú','Vinh'];
const TEN_NU  = ['Anh','Chi','Dung','Hà','Hạnh','Hoa','Huyền','Lan','Linh','Mai','Nga','Nhung','Oanh','Quỳnh','Thảo','Trang','Vân','Yến'];

/* PRNG tiền định — dữ liệu mẫu giống nhau giữa các lần tải */
let _seed = 20261109;
function rnd() { _seed = (_seed * 1103515245 + 12345) & 0x7fffffff; return _seed / 0x7fffffff; }
const pick = a => a[Math.floor(rnd() * a.length)];
const rint = (a, b) => a + Math.floor(rnd() * (b - a + 1));

function khongDau(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
}
function iso(d) { return d.toISOString().slice(0, 10); }
function addMonths(dstr, m) {
  const d = new Date(dstr); const day = d.getDate();
  d.setMonth(d.getMonth() + m);
  if (d.getDate() < day) d.setDate(0);
  return iso(d);
}

function viTriTheoPhong(pb) {
  if (pb === 'BGD') return pick(['Tổng Giám đốc', 'Phó Tổng Giám đốc']);
  if (pb === 'KT')  return pick(['Kế toán trưởng', 'Kế toán viên', 'Kế toán viên', 'Chuyên viên']);
  if (pb === 'IT')  return pick(['Lập trình viên', 'Lập trình viên', 'Trưởng nhóm', 'Kỹ thuật viên']);
  if (pb === 'SX')  return pick(['Công nhân', 'Công nhân', 'Công nhân', 'Kỹ thuật viên', 'Trưởng nhóm']);
  if (pb === 'KD' || pb === 'KD1' || pb === 'KD2') return pick(['Nhân viên kinh doanh', 'Nhân viên kinh doanh', 'Trưởng nhóm', 'Trưởng phòng']);
  return pick(['Chuyên viên', 'Nhân viên', 'Trưởng phòng', 'Phó phòng', 'Thực tập sinh']);
}
function chucDanhTheoViTri(vt) {
  if (/Tổng Giám đốc/.test(vt)) return 'Quản lý cấp cao';
  if (/Trưởng phòng|Phó phòng|Kế toán trưởng|Trưởng nhóm/.test(vt)) return 'Quản lý cấp trung';
  if (/Công nhân|Kỹ thuật viên/.test(vt)) return 'Lao động trực tiếp';
  if (/Thực tập/.test(vt)) return 'Thực tập';
  return 'Chuyên môn nghiệp vụ';
}
function luongTheoViTri(vt) {
  const base = {
    'Tổng Giám đốc': 80, 'Phó Tổng Giám đốc': 60, 'Kế toán trưởng': 35, 'Trưởng phòng': 32,
    'Phó phòng': 25, 'Trưởng nhóm': 22, 'Lập trình viên': 24, 'Chuyên viên': 16,
    'Kế toán viên': 14, 'Nhân viên kinh doanh': 12, 'Nhân viên': 11,
    'Kỹ thuật viên': 10, 'Công nhân': 8, 'Thực tập sinh': 4,
  }[vt] || 12;
  return (base + rint(-1, 3)) * 1_000_000;
}

function taoNhanVien(i) {
  const nam = rnd() < 0.55;
  const ho = pick(HO), dem = nam ? pick(DEM_NAM) : pick(DEM_NU), ten = nam ? pick(TEN_NAM) : pick(TEN_NU);
  const hoTen = `${ho} ${dem} ${ten}`;
  const pb = pick(['HC', 'KT', 'KD', 'KD1', 'KD2', 'MKT', 'IT', 'SX', 'SX', 'KD1']);
  const viTri = viTriTheoPhong(pb);
  const ngaySinh = iso(new Date(rint(1972, 2003), rint(0, 11), rint(1, 28)));
  const ngayVao  = iso(new Date(rint(2014, 2026), rint(0, 11), rint(1, 28)));
  const tinh = pick(DM.tinh);

  // trạng thái: phần lớn đang làm việc
  const r = rnd();
  let tt = 'DLV';
  if (r > 0.94) tt = 'DNV'; else if (r > 0.88) tt = 'TVL';
  else if (r > 0.855 && !nam) tt = 'NTS'; else if (r > 0.845) tt = 'NKL';

  const email = `${khongDau(ten).toLowerCase()}.${khongDau(ho).toLowerCase()}${i}@congtyabc.vn`;
  const luong = luongTheoViTri(viTri);

  // ----- lịch sử hợp đồng -----
  const hopDong = [];
  let mocTV = ngayVao;
  hopDong.push({
    so: `TV-${String(i).padStart(3, '0')}/2024`, loai: 'TV', tuNgay: mocTV, denNgay: addMonths(mocTV, 2),
    luong: Math.round(luong * 0.85), kieuLuong: 'GROSS', trangThai: 'Hết hiệu lực', nguoiKy: 'Nguyễn Văn An',
  });
  if (tt !== 'TVL') {
    const t2 = addMonths(mocTV, 2);
    hopDong.push({
      so: `HĐLĐ-${String(i).padStart(3, '0')}/2024`, loai: 'XD12', tuNgay: t2, denNgay: addMonths(t2, 12),
      luong, kieuLuong: 'GROSS', trangThai: 'Hết hiệu lực', nguoiKy: 'Nguyễn Văn An',
    });
    if (rnd() > 0.45) {
      const t3 = addMonths(t2, 12);
      hopDong.push({
        so: `HĐLĐ-${String(i).padStart(3, '0')}/2025`, loai: rnd() > 0.5 ? 'KXD' : 'XD36',
        tuNgay: t3, denNgay: rnd() > 0.5 ? '' : addMonths(t3, 36),
        luong: Math.round(luong * 1.12), kieuLuong: 'GROSS',
        trangThai: tt === 'DNV' ? 'Hết hiệu lực' : 'Đang hiệu lực', nguoiKy: 'Nguyễn Văn An',
      });
    } else {
      hopDong[hopDong.length - 1].trangThai = tt === 'DNV' ? 'Hết hiệu lực' : 'Đang hiệu lực';
    }
  } else {
    hopDong[0].trangThai = 'Đang hiệu lực';
  }
  const hdHienTai = hopDong.filter(h => h.trangThai === 'Đang hiệu lực').pop() || hopDong[hopDong.length - 1];

  // ----- lịch sử lương -----
  const luongSu = hopDong.map(h => ({
    tuNgay: h.tuNgay, luongCB: h.luong, kieu: h.kieuLuong,
    phuCap: Math.round(h.luong * 0.1 / 100000) * 100000,
    lyDo: h.loai === 'TV' ? 'Lương thử việc' : 'Theo hợp đồng lao động',
  }));
  if (tt === 'DLV' && rnd() > 0.6) {
    const last = luongSu[luongSu.length - 1];
    luongSu.push({
      tuNgay: addMonths(last.tuNgay, 14), luongCB: Math.round(last.luongCB * 1.1), kieu: 'GROSS',
      phuCap: last.phuCap, lyDo: 'Điều chỉnh lương định kỳ 2026',
    });
  }
  const luongHT = luongSu[luongSu.length - 1];

  // ----- gia đình -----
  const giaDinh = [];
  const daKetHon = new Date(ngaySinh).getFullYear() < 1996 ? rnd() > 0.25 : rnd() > 0.7;
  if (daKetHon) {
    giaDinh.push({
      hoTen: `${pick(HO)} ${nam ? pick(DEM_NU) : pick(DEM_NAM)} ${nam ? pick(TEN_NU) : pick(TEN_NAM)}`,
      quanHe: nam ? 'Vợ' : 'Chồng', namSinh: new Date(ngaySinh).getFullYear() + rint(-3, 3),
      ngheNghiep: pick(['Giáo viên', 'Kinh doanh', 'Kỹ sư', 'Tự do', 'Công nhân']),
      phuThuoc: false, mst: '',
    });
    for (let k = 0; k < rint(0, 2); k++) {
      giaDinh.push({
        hoTen: `${ho} ${pick(DEM_NU)} ${pick(rnd() > 0.5 ? TEN_NU : TEN_NAM)}`, quanHe: 'Con',
        namSinh: rint(2012, 2025), ngheNghiep: 'Học sinh', phuThuoc: true,
        mst: `86${rint(10000000, 99999999)}`,
      });
    }
  }

  // ----- học vấn -----
  const hv = /Công nhân/.test(viTri) ? pick(['THPT', 'Trung cấp']) :
             /Tổng Giám đốc|Trưởng phòng|Kế toán trưởng/.test(viTri) ? pick(['Sau đại học', 'Đại học']) :
             pick(['Đại học', 'Đại học', 'Cao đẳng']);
  const hocVan = [{
    trinhDo: hv,
    truong: pick(['ĐH Kinh tế Quốc dân', 'ĐH Bách khoa Hà Nội', 'ĐH Thương mại', 'ĐH Công nghiệp HN', 'Cao đẳng Kỹ thuật', 'THPT Chu Văn An']),
    chuyenNganh: pick(['Quản trị kinh doanh', 'Kế toán', 'Công nghệ thông tin', 'Marketing', 'Cơ khí', 'Điện tử', '—']),
    namTN: new Date(ngaySinh).getFullYear() + rint(22, 25),
    xepLoai: pick(['Xuất sắc', 'Giỏi', 'Khá', 'Khá', 'Trung bình']),
  }];

  // ----- khen thưởng / kỷ luật -----
  const khenThuong = [];
  for (let k = 0; k < (rnd() > 0.45 ? rint(1, 3) : 0); k++) {
    khenThuong.push({
      ngay: iso(new Date(rint(2023, 2026), rint(0, 11), rint(1, 28))),
      noiDung: pick(DM.khenThuong), hinhThuc: pick(DM.hinhThucKT),
      soTien: pick([500000, 1000000, 2000000, 3000000, 5000000]),
      soQD: `QĐ-${rint(10, 99)}/KT`,
    });
  }
  const kyLuat = [];
  if (rnd() > 0.88) {
    kyLuat.push({
      ngay: iso(new Date(rint(2024, 2026), rint(0, 11), rint(1, 28))),
      noiDung: pick(['Đi muộn nhiều lần trong tháng', 'Không hoàn thành KPI 2 tháng liên tiếp', 'Vi phạm nội quy an toàn lao động']),
      hinhThuc: pick(DM.kyLuat), soQD: `QĐ-${rint(10, 99)}/KL`,
    });
  }

  // ----- điều chuyển / bổ nhiệm -----
  const dieuChuyen = [];
  if (rnd() > 0.72) {
    dieuChuyen.push({
      ngay: addMonths(ngayVao, rint(13, 30)), loai: pick(['Điều chuyển', 'Bổ nhiệm', 'Thay đổi vị trí']),
      tuPhong: pick(DM.phongBan).ten, denPhong: DM.phongBan.find(p => p.id === pb).ten,
      viTriMoi: viTri, soQD: `QĐ-${rint(10, 99)}/NS`, lyDo: pick(['Theo nhu cầu công việc', 'Theo nguyện vọng cá nhân', 'Kiện toàn bộ máy']),
    });
  }

  return {
    id: 'NV' + String(i).padStart(4, '0'),
    ma: 'NV' + String(i).padStart(4, '0'),
    hoTen, gioiTinh: nam ? 'Nam' : 'Nữ', ngaySinh,
    noiSinh: tinh, danToc: pick(DM.danToc), tonGiao: pick(DM.tonGiao), quocTich: 'Việt Nam',
    honNhan: daKetHon ? 'Đã kết hôn' : 'Độc thân',
    cccd: String(rint(1, 9)) + String(rint(10000000000, 99999999999)),
    cccdNgayCap: iso(new Date(rint(2018, 2024), rint(0, 11), rint(1, 28))),
    cccdNoiCap: 'Cục Cảnh sát QLHC về TTXH',
    hoKhau: `Số ${rint(1, 200)}, đường ${pick(['Trần Phú', 'Lê Lợi', 'Nguyễn Trãi', 'Hoàng Hoa Thám', 'Quang Trung'])}, ${tinh}`,
    choO: `Số ${rint(1, 200)}, ${pick(['P. Dịch Vọng', 'P. Bến Nghé', 'P. Trung Hòa', 'P. Tân Định'])}, ${tinh}`,
    dienThoai: '0' + pick(['9', '8', '7', '3']) + String(rint(10000000, 99999999)),
    email, emailCaNhan: `${khongDau(ten).toLowerCase()}${rint(80, 99)}@gmail.com`,

    phongBan: pb, viTri, chucDanh: chucDanhTheoViTri(viTri),
    quanLy: '', ngayVao, trangThai: tt,
    ngayNghi: tt === 'DNV' ? addMonths(ngayVao, rint(14, 40)) : '',
    lyDoNghi: tt === 'DNV' ? pick(['Chuyển công tác', 'Lý do cá nhân', 'Hết hạn hợp đồng', 'Tái cấu trúc']) : '',
    noiLamViec: pick(['Trụ sở Hà Nội', 'Chi nhánh TP. HCM', 'Nhà máy Bắc Ninh']),
    hinhThucLV: /Công nhân/.test(viTri) ? 'Theo ca' : 'Hành chính',

    mst: `8${rint(100000000, 999999999)}`,
    soBHXH: `01${rint(10000000, 99999999)}`,
    bhxhTuNgay: addMonths(ngayVao, 2),
    mucDongBH: Math.round(luongHT.luongCB * 0.8 / 100000) * 100000,
    soBHYT: `DN4010${rint(1000000, 9999999)}`,
    nganHang: pick(DM.nganHang),
    soTK: String(rint(1000000000, 9999999999)),
    chuTK: khongDau(hoTen).toUpperCase(),

    hopDong, hdHienTai, luongSu, luongHT, giaDinh, hocVan, khenThuong, kyLuat, dieuChuyen,

      { ten: 'Bằng tốt nghiệp (bản sao)', loai: 'Văn bằng', ngay: ngayVao, dungLuong: `${rint(500, 1500)} KB` },
      { ten: 'Giấy khám sức khỏe', loai: 'Y tế', ngay: ngayVao, dungLuong: `${rint(300, 800)} KB` },
    ].slice(0, rint(2, 4)),
    taiKhoan: tt === 'DNV' ? 'Đã khóa' : (rnd() > 0.18 ? 'Đang hoạt động' : 'Chưa kích hoạt'),
    anh: '',
    ghiChu: '',
  };
}

/* ---- gán quản lý trực tiếp theo phòng ban ---- */
function seedData() {
  _seed = 20261109;
  const list = [];
  for (let i = 1; i <= 68; i++) list.push(taoNhanVien(i));

  /* Chuẩn hóa hạn hợp đồng: nhân viên đang làm việc không thể mang hợp đồng đã quá hạn.
     Giữ lại một nhóm nhỏ sắp hết hạn (5–55 ngày) để thấy được cảnh báo gia hạn. */
  const MOC = new Date('2026-11-09');
  const dichNgay = n => iso(new Date(MOC.getTime() + n * 86400000));
  list.forEach(e => {
    if (e.trangThai === 'DNV') return;
    const hd = e.hdHienTai;
    if (!hd || !hd.denNgay) return;
    if (new Date(hd.denNgay) >= MOC) return;
    const moi = rnd() < 0.14 ? dichNgay(rint(5, 55)) : dichNgay(rint(120, 900));
    hd.denNgay = moi;
    if (hd.tuNgay >= moi) hd.tuNgay = dichNgay(-rint(200, 600));
  });

  // người đứng đầu từng phòng
  const truong = {};
  DM.phongBan.forEach(p => {
    const cand = list.find(e => e.phongBan === p.id && /Trưởng phòng|Kế toán trưởng|Tổng Giám đốc/.test(e.viTri) && e.trangThai !== 'DNV');
    if (cand) truong[p.id] = cand;
  });
  // đảm bảo có 1 TGĐ
  const tgd = list[0];
  tgd.phongBan = 'BGD'; tgd.viTri = 'Tổng Giám đốc'; tgd.chucDanh = 'Quản lý cấp cao';
  tgd.trangThai = 'DLV'; tgd.ngayNghi = ''; tgd.lyDoNghi = '';
  truong['BGD'] = tgd;

  list.forEach(e => {
    if (e === tgd) return;
    const pb = DM.phongBan.find(p => p.id === e.phongBan);
    let mgr = truong[e.phongBan];
    if (!mgr || mgr === e) mgr = (pb && truong[pb.parent]) || tgd;
    e.quanLy = mgr.id;
  });
  return list;
}

/* ---- yêu cầu duyệt hồ sơ (nhân viên tự cập nhật) ---- */
function seedDuyet(list) {
  _seed = 777;
  const act = list.filter(e => e.trangThai !== 'DNV');
  const out = [];
  for (let i = 0; i < 7; i++) {
    const e = act[rint(0, act.length - 1)];
    const truong = pick([
      { f: 'dienThoai', l: 'Điện thoại', v: '0' + pick(['9', '8']) + String(rint(10000000, 99999999)) },
      { f: 'choO', l: 'Chỗ ở hiện tại', v: `Số ${rint(1, 99)}, P. Mỹ Đình, Hà Nội` },
      { f: 'honNhan', l: 'Tình trạng hôn nhân', v: 'Đã kết hôn' },
      { f: 'soTK', l: 'Số tài khoản', v: String(rint(1000000000, 9999999999)) },
      { f: 'emailCaNhan', l: 'Email cá nhân', v: `nv${rint(100, 999)}@gmail.com` },
    ]);
    out.push({
      id: 'YC' + String(i + 1).padStart(3, '0'),
      nvId: e.id, nvTen: e.hoTen, nvMa: e.ma,
      truong: truong.f, nhanTruong: truong.l,
      giaTriCu: e[truong.f], giaTriMoi: truong.v,
      ngayGui: iso(new Date(2026, 10, rint(1, 9))),
      trangThai: 'Chờ duyệt',
    });
  }
  return out;
}

function save() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ nv: S.nv, duyet: S.duyet }));
  } catch (e) { console.warn('Không lưu được localStorage', e); }
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.nv) && d.nv.length) { S.nv = d.nv; S.duyet = d.duyet || []; return; }
    }
  } catch (e) { console.warn(e); }
  resetData(false);
}
function resetData(notify = true) {
  S.nv = seedData();
  S.duyet = seedDuyet(S.nv);
  S.sel.clear(); S.page = 1;
  save();
  if (notify) toast('Đã nạp lại dữ liệu mẫu', 'ok');
}

/* ---------- tiện ích ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const TODAY = new Date('2026-11-09');
function dmy(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; }
function money(n) { return (n == null || n === '') ? '' : Number(n).toLocaleString('vi-VN'); }
function tenPhong(id) { const p = DM.phongBan.find(x => x.id === id); return p ? p.ten : id || ''; }
function tenTT(id) { const t = DM.trangThai.find(x => x.id === id); return t ? t.ten : id || ''; }
function tagTT(id) { const t = DM.trangThai.find(x => x.id === id); return t ? t.tag : 't-grey'; }
function tenHD(id) { const h = DM.loaiHD.find(x => x.id === id); return h ? h.ten : id || ''; }
function tuoi(ns) { if (!ns) return ''; return Math.floor((TODAY - new Date(ns)) / 31557600000); }
function thamNien(nv) {
  if (!nv.ngayVao) return '';
  const moc = nv.trangThai === 'DNV' && nv.ngayNghi ? new Date(nv.ngayNghi) : TODAY;
  const th = Math.max(0, Math.round((moc - new Date(nv.ngayVao)) / 2629800000));
  const y = Math.floor(th / 12), m = th % 12;
  return y ? `${y} năm${m ? ' ' + m + ' th' : ''}` : `${m} tháng`;
}
function nvById(id) { return S.nv.find(e => e.id === id); }
function tenNV(id) { const e = nvById(id); return e ? e.hoTen : ''; }

const AVA_BG = ['#1565d8', '#19a974', '#7a4ddb', '#e8930c', '#e0384d', '#0f9bb3', '#d4538a', '#5b6cc9'];
function avaColor(s) {
  let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 9973;
  return AVA_BG[h % AVA_BG.length];
}
function initials(ten) {
  const p = String(ten).trim().split(/\s+/);
  return ((p[0] || '')[0] + (p[p.length - 1] || '')[0]).toUpperCase();
}
function ava(nv, cls = '') {
  return `<span class="ava ${cls}" style="background:${avaColor(nv.id || nv.hoTen)}">${esc(initials(nv.hoTen))}</span>`;
}

/* hạn hợp đồng còn lại (ngày); null = vô hạn/không có */
function conLaiHD(nv) {
  const hd = nv.hdHienTai;
  if (!hd || !hd.denNgay) return null;
  return Math.round((new Date(hd.denNgay) - TODAY) / 86400000);
}

function toast(msg, kind = '') {
  let box = $('.toast-box');
  if (!box) { box = document.createElement('div'); box.className = 'toast-box'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 2600);
}

/* ---------- lọc & sắp xếp ---------- */
function colVal(nv, k) {
  switch (k) {
    case 'phongBan': return tenPhong(nv.phongBan);
    case 'trangThai': return tenTT(nv.trangThai);
    case 'loaiHD': return tenHD(nv.hdHienTai && nv.hdHienTai.loai);
    case 'hanHD': return (nv.hdHienTai && nv.hdHienTai.denNgay) || '';
    case 'luong': return (nv.luongHT && nv.luongHT.luongCB) || 0;
    case 'tuoi': return tuoi(nv.ngaySinh);
    case 'thamNien': return nv.ngayVao || '';
    case 'quanLy': return tenNV(nv.quanLy);
    case 'hocVan': return (nv.hocVan && nv.hocVan[0] && nv.hocVan[0].trinhDo) || '';
    default: return nv[k] ?? '';
  }
}
function cellHtml(nv, k) {
  switch (k) {
    case 'hoTen':
      return `<div class="emp-cell">${ava(nv)}<div><div class="emp-name" data-open="${nv.id}">${esc(nv.hoTen)}</div>
        <div class="emp-code">${esc(nv.viTri)}</div></div></div>`;
    case 'trangThai':
      return `<span class="tag ${tagTT(nv.trangThai)}">${esc(tenTT(nv.trangThai))}</span>`;
    case 'hanHD': {
      const hd = nv.hdHienTai;
      if (!hd) return '<span class="emp-code">—</span>';
      if (!hd.denNgay) return '<span class="emp-code">Không hạn</span>';
      const cl = conLaiHD(nv);
      const w = cl !== null && cl >= 0 && cl <= 60;
      return `${dmy(hd.denNgay)}${w ? ` <span class="tag t-amber">còn ${cl}n</span>` : (cl < 0 ? ' <span class="tag t-red">hết hạn</span>' : '')}`;
    }
    case 'luong': return money(colVal(nv, 'luong'));
    case 'ngaySinh': case 'ngayVao': return dmy(nv[k]);
    case 'thamNien': return thamNien(nv);
    case 'taiKhoan': {
      const m = { 'Đang hoạt động': 't-green', 'Chưa kích hoạt': 't-amber', 'Đã khóa': 't-grey' };
      return `<span class="tag ${m[nv.taiKhoan] || 't-grey'}">${esc(nv.taiKhoan)}</span>`;
    }
    case 'email': return `<a href="mailto:${esc(nv.email)}">${esc(nv.email)}</a>`;
    default: return esc(colVal(nv, k));
  }
}

function filtered() {
  const q = S.q.trim().toLowerCase();
  const qn = khongDau(q);
  let out = S.nv.filter(nv => {
    if (q) {
      const hay = khongDau(`${nv.ma} ${nv.hoTen} ${nv.email} ${nv.dienThoai} ${nv.cccd} ${nv.viTri} ${tenPhong(nv.phongBan)}`).toLowerCase();
      if (!hay.includes(qn)) return false;
    }
    const f = S.f;
    if (f.phongBan && nv.phongBan !== f.phongBan) return false;
    if (f.viTri && nv.viTri !== f.viTri) return false;
    if (f.trangThai && nv.trangThai !== f.trangThai) return false;
    if (f.gioiTinh && nv.gioiTinh !== f.gioiTinh) return false;
    if (f.chucDanh && nv.chucDanh !== f.chucDanh) return false;
    if (f.loaiHD && !(nv.hdHienTai && nv.hdHienTai.loai === f.loaiHD)) return false;
    if (f.vaoTu && nv.ngayVao < f.vaoTu) return false;
    if (f.vaoDen && nv.ngayVao > f.vaoDen) return false;
    return true;
  });
  const { k, dir } = S.sort;
  out.sort((a, b) => {
    const x = colVal(a, k), y = colVal(b, k);
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y), 'vi') * dir;
  });
  return out;
}

/* ---------- router ---------- */
/* render được gọi muộn (thunk) vì views.js nạp sau app.js */
const VIEWS = {
  tongquan:  { t: 'Tổng quan nhân sự',    render: () => viewTongQuan() },
  hoso:      { t: 'Quản lý hồ sơ',        render: () => viewHoSo() },
  duyet:     { t: 'Duyệt hồ sơ',          render: () => viewDuyet() },
  sodo:      { t: 'Sơ đồ tổ chức',        render: () => viewSoDo() },
  danhmuc:   { t: 'Danh mục & thiết lập', render: () => viewDanhMuc() },
};
function go(v) {
  S.view = v; S.sel.clear();
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  render();
}
function render() {
  const V = VIEWS[S.view];
  $('#page-title').textContent = V.t;
  $('#crumb').textContent = 'Thông tin nhân sự / ' + V.t;
  $('#content').innerHTML = V.render();
  if (VIEWS[S.view].after) VIEWS[S.view].after();
  afterRender();
}
function afterRender() {
  const b = $('#badge-duyet');
  if (b) {
    const n = S.duyet.filter(d => d.trangThai === 'Chờ duyệt').length;
    b.textContent = n || ''; b.style.display = n ? '' : 'none';
  }
  const bn = $('#badge-nv');
  if (bn) bn.textContent = S.nv.filter(e => e.trangThai !== 'DNV').length;
}

/* ---------- khởi động ---------- */
function khoiDong() {
  load();
  $$('.nav-item').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
  $('#btn-reset').addEventListener('click', () => {
    if (confirm('Xóa toàn bộ dữ liệu thử trong trình duyệt và nạp lại dữ liệu mẫu?')) { resetData(); render(); }
  });
  bindGlobal();
  go('tongquan');
}
/* Bản gộp 1 tệp có thể chạy sau khi DOM đã sẵn sàng — khi đó DOMContentLoaded không bao giờ bắn nữa. */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', khoiDong);
else khoiDong();

/* ---------------- TỔNG QUAN ---------------- */
function viewTongQuan() {
  const all = S.nv, act = all.filter(e => e.trangThai !== 'DNV');
  const byTT = DM.trangThai.map(t => ({ ...t, n: all.filter(e => e.trangThai === t.id).length }));
  const byPB = DM.phongBan.map(p => ({ ...p, n: act.filter(e => e.phongBan === p.id).length }))
    .filter(p => p.n > 0).sort((a, b) => b.n - a.n);
  const maxPB = Math.max(1, ...byPB.map(p => p.n));

  const nu = act.filter(e => e.gioiTinh === 'Nữ').length;
  const tuoiTB = act.length ? Math.round(act.reduce((s, e) => s + tuoi(e.ngaySinh), 0) / act.length) : 0;
  const qtl = act.reduce((s, e) => s + ((e.luongHT && e.luongHT.luongCB) || 0), 0);

  const sapHet = act.map(e => ({ e, cl: conLaiHD(e) })).filter(x => x.cl !== null && x.cl >= 0 && x.cl <= 60)
    .sort((a, b) => a.cl - b.cl).slice(0, 8);
  const hetHan = act.map(e => ({ e, cl: conLaiHD(e) })).filter(x => x.cl !== null && x.cl < 0).length;

  const thisM = TODAY.getMonth();
  const sinhNhat = act.filter(e => new Date(e.ngaySinh).getMonth() === thisM)
    .sort((a, b) => new Date(a.ngaySinh).getDate() - new Date(b.ngaySinh).getDate()).slice(0, 8);

  const moiVao = [...act].sort((a, b) => b.ngayVao.localeCompare(a.ngayVao)).slice(0, 6);
  const choDuyet = S.duyet.filter(d => d.trangThai === 'Chờ duyệt').length;
  const thieuTL = act.filter(e => (e.taiLieu || []).length < 4).length;

  return `
  <div class="kpis">
    <div class="kpi"><div class="lbl">Tổng nhân sự đang quản lý</div><div class="val">${all.length}</div>
      <div class="sub">${act.length} đang hoạt động · ${all.length - act.length} đã nghỉ</div></div>
    <div class="kpi"><div class="lbl">Tỷ lệ nữ</div><div class="val">${act.length ? Math.round(nu / act.length * 100) : 0}%</div>
      <div class="sub">${nu} nữ / ${act.length - nu} nam</div></div>
    <div class="kpi"><div class="lbl">Tuổi trung bình</div><div class="val">${tuoiTB}</div>
      <div class="sub">toàn bộ nhân sự hoạt động</div></div>
    <div class="kpi"><div class="lbl">Quỹ lương cơ bản / tháng</div><div class="val">${money(Math.round(qtl / 1e6))}<span style="font-size:13px;font-weight:400"> tr</span></div>
      <div class="sub">theo lương đang hiệu lực</div></div>
    <div class="kpi"><div class="lbl">HĐ sắp hết hạn (≤60 ngày)</div><div class="val" style="color:var(--amber)">${sapHet.length}</div>
      <div class="sub">${hetHan} hợp đồng đã quá hạn</div></div>
    <div class="kpi"><div class="lbl">Hồ sơ chờ duyệt</div><div class="val" style="color:var(--blue)">${choDuyet}</div>
      <div class="sub">${thieuTL} hồ sơ thiếu tài liệu</div></div>
  </div>

  <div class="grid2" style="margin-bottom:12px">
    <div class="panel"><div class="panel-hd"><h3>Nhân sự theo phòng ban</h3>
      <span class="spacer"></span><button class="link-btn" data-goto="hoso">Xem danh sách</button></div>
      <div class="panel-bd">
        ${byPB.map(p => `<div class="bar-row"><div class="nm">${esc(p.ten)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${p.n / maxPB * 100}%"></div></div>
          <div class="n">${p.n}</div></div>`).join('')}
      </div></div>
    <div class="panel"><div class="panel-hd"><h3>Cơ cấu theo trạng thái</h3></div>
      <div class="panel-bd">
        <ul class="list-lite">
        ${byTT.map(t => `<li><span class="tag ${t.tag}">${esc(t.ten)}</span>
          <span class="meta"><b style="font-size:14px;color:var(--ink)">${t.n}</b> người · ${all.length ? Math.round(t.n / all.length * 100) : 0}%</span></li>`).join('')}
        </ul>
        <div class="sec-title" style="margin-top:14px">Theo chức danh</div>
        <ul class="list-lite">
        ${DM.chucDanh.map(c => { const n = act.filter(e => e.chucDanh === c).length; return n ? `<li>${esc(c)}<span class="meta">${n}</span></li>` : ''; }).join('')}
        </ul>
      </div></div>
  </div>

  <div class="grid3">
    <div class="panel"><div class="panel-hd"><h3>Hợp đồng sắp hết hạn</h3></div>
      <div class="panel-bd">${sapHet.length ? `<ul class="list-lite">${sapHet.map(x => `
        <li>${ava(x.e)}<div><div class="emp-name" data-open="${x.e.id}">${esc(x.e.hoTen)}</div>
        <div class="emp-code">${esc(tenHD(x.e.hdHienTai.loai))}</div></div>
        <span class="meta">${dmy(x.e.hdHienTai.denNgay)}<br><span class="tag t-amber">còn ${x.cl} ngày</span></span></li>`).join('')}</ul>`
        : '<div class="empty">Không có hợp đồng nào sắp hết hạn</div>'}</div></div>

    <div class="panel"><div class="panel-hd"><h3>Sinh nhật tháng ${thisM + 1}</h3></div>
      <div class="panel-bd">${sinhNhat.length ? `<ul class="list-lite">${sinhNhat.map(e => `
        <li>${ava(e)}<div><div class="emp-name" data-open="${e.id}">${esc(e.hoTen)}</div>
        <div class="emp-code">${esc(tenPhong(e.phongBan))}</div></div>
        <span class="meta">${dmy(e.ngaySinh).slice(0, 5)}<br>${tuoi(e.ngaySinh)} tuổi</span></li>`).join('')}</ul>`
        : '<div class="empty">Không có sinh nhật trong tháng</div>'}</div></div>

    <div class="panel"><div class="panel-hd"><h3>Mới vào làm</h3></div>
      <div class="panel-bd"><ul class="list-lite">${moiVao.map(e => `
        <li>${ava(e)}<div><div class="emp-name" data-open="${e.id}">${esc(e.hoTen)}</div>
        <div class="emp-code">${esc(e.viTri)}</div></div>
        <span class="meta">${dmy(e.ngayVao)}<br><span class="tag ${tagTT(e.trangThai)}">${esc(tenTT(e.trangThai))}</span></span></li>`).join('')}</ul></div></div>
  </div>`;
}

/* ---------------- DANH SÁCH HỒ SƠ ---------------- */

  if (S.page > pages) S.page = pages;
  const start = (S.page - 1) * S.perPage;
  const slice = rows.slice(start, start + S.perPage);
  const cols = COLS.filter(c => S.cols.includes(c.k));
  const allSel = slice.length && slice.every(e => S.sel.has(e.id));

  const chips = [];
  const f = S.f;
  if (f.phongBan) chips.push(['phongBan', 'Phòng ban: ' + tenPhong(f.phongBan)]);
  if (f.viTri) chips.push(['viTri', 'Vị trí: ' + f.viTri]);
  if (f.chucDanh) chips.push(['chucDanh', 'Chức danh: ' + f.chucDanh]);
  if (f.trangThai) chips.push(['trangThai', 'Trạng thái: ' + tenTT(f.trangThai)]);

  return `

      ${DM.loaiHD.map(h => `<option value="${h.id}" ${f.loaiHD === h.id ? 'selected' : ''}>${esc(h.ten)}</option>`).join('')}</select>
    <button class="btn" id="btn-more-filter">Lọc nâng cao ▾</button>

    <div class="seg"><button class="${S.mode === 'table' ? 'on' : ''}" data-mode="table">▤ Bảng</button>
      <button class="${S.mode === 'card' ? 'on' : ''}" data-mode="card">▣ Thẻ</button></div>
    <button class="btn" id="btn-cols">⚙ Cột</button>
    <button class="btn" id="btn-import">⭳ Nhập Excel</button>

  ${S.mode === 'card' ? renderCards(slice) : `

      <button data-pg="${S.page - 1}" ${S.page === 1 ? 'disabled' : ''}>‹</button>
      ${pageBtns(S.page, pages)}
      <button data-pg="${S.page + 1}" ${S.page === pages ? 'disabled' : ''}>›</button>
      <button data-pg="${pages}" ${S.page === pages ? 'disabled' : ''}>»</button>
    </div>
  </div>

  ${S.sel.size ? `<div class="bulkbar">
    <b>${S.sel.size}</b> hồ sơ đã chọn
    <button class="btn btn-sm" id="bulk-edit">✎ Sửa hàng loạt</button>
    <button class="btn btn-sm" id="bulk-contract">📄 Gia hạn / thêm HĐ</button>
    <button class="btn btn-sm" id="bulk-acc">🔑 Tài khoản đăng nhập</button>
    <button class="btn btn-sm" id="bulk-mail">✉ Gửi email</button>
    <button class="btn btn-sm" id="bulk-merge">⎙ Trộn văn bản</button>
    <button class="btn btn-sm" id="bulk-export">⭱ Xuất file</button>
    <button class="btn btn-sm" id="bulk-del">🗑 Xóa</button>
    <span class="spacer"></span>
    <button class="btn btn-sm" id="bulk-clear">Bỏ chọn</button></div>` : ''}`;
}

function pageBtns(cur, pages) {
  const out = [];
  let a = Math.max(1, cur - 2), b = Math.min(pages, a + 4);
  a = Math.max(1, b - 4);
  for (let i = a; i <= b; i++) out.push(`<button data-pg="${i}" class="${i === cur ? 'on' : ''}">${i}</button>`);
  return out.join('');
}

function renderCards(list) {

function viewSoDo() {
  const act = S.nv.filter(e => e.trangThai !== 'DNV');
  function nodeOf(pid) {
    const p = DM.phongBan.find(x => x.id === pid);
    const mems = act.filter(e => e.phongBan === pid);
    const head = mems.find(e => /Tổng Giám đốc|Trưởng phòng|Kế toán trưởng/.test(e.viTri));
    const kids = DM.phongBan.filter(x => x.parent === pid);
    const rest = mems.filter(e => e !== head);
    return `<li>
      <div class="org-node"><span class="dept-n">${esc(p.ten)}</span>
        <span class="tag t-blue">${mems.length} người</span></div>
      <ul>

          <span class="emp-code"> — ${esc(head.viTri)}</span></span></div></li>` : ''}
        ${rest.length ? `<li><div class="org-node" style="background:#f7f9fb">
          ${rest.slice(0, 6).map(e => ava(e)).join(' ')}
          <span class="emp-code">${rest.length} nhân viên${rest.length > 6 ? ' (hiển thị 6)' : ''}</span>

}

function fset(title, body) { return `<div class="fieldset"><h4>${esc(title)}</h4>${body}</div>`; }
function miniTbl(head, rows, emptyMsg) {

          esc(g.mst) || '<span class="emp-code">—</span>',
        ]), 'Chưa khai báo quan hệ gia đình')}`;

    /* ---- học vấn ---- */
    case 'hocvan': return `
      <div class="toolbar"><span class="hint">Trình độ, bằng cấp & chứng chỉ</span>
        <span class="spacer"></span><button class="btn btn-primary btn-sm" data-addhv="${nv.id}">+ Thêm bằng cấp</button></div>

        <span class="spacer"></span><button class="btn btn-sm" data-addkt="${nv.id}">+ Khen thưởng</button>
        <button class="btn btn-sm" data-addkl="${nv.id}">+ Kỷ luật</button></div>
      ${fset('Khen thưởng', miniTbl([['Ngày'], ['Nội dung'], ['Hình thức'], ['Số tiền', 'num'], ['Số quyết định']],
        (nv.khenThuong || []).map(k => [dmy(k.ngay), esc(k.noiDung), `<span class="tag t-green">${esc(k.hinhThuc)}</span>`,
          money(k.soTien), esc(k.soQD)]), 'Chưa có khen thưởng'))}
      ${fset('Kỷ luật', miniTbl([['Ngày'], ['Nội dung vi phạm'], ['Hình thức'], ['Số quyết định']],
        (nv.kyLuat || []).map(k => [dmy(k.ngay), esc(k.noiDung), `<span class="tag t-red">${esc(k.hinhThuc)}</span>`, esc(k.soQD)]),
        'Không có kỷ luật'))}`;

    /* ---- điều chuyển ---- */
    case 'dieuchuyen': return `
      <div class="toolbar"><span class="hint">Quyết định bổ nhiệm, điều chuyển, thay đổi vị trí</span>
        <span class="spacer"></span><button class="btn btn-primary btn-sm" data-adddc="${nv.id}">+ Thêm quyết định</button></div>
      ${miniTbl([['Ngày hiệu lực'], ['Loại'], ['Từ phòng ban'], ['Đến phòng ban'], ['Vị trí mới'], ['Số QĐ'], ['Lý do']],
        (nv.dieuChuyen || []).map(d => [dmy(d.ngay), `<span class="tag t-blue">${esc(d.loai)}</span>`,
          esc(d.tuPhong), esc(d.denPhong), esc(d.viTriMoi), esc(d.soQD), esc(d.lyDo)]),
        'Chưa có quyết định điều chuyển / bổ nhiệm')}`;

    /* ---- tài liệu ---- */
    case 'tailieu': {
      const need = ['Giấy tờ tùy thân', 'Hồ sơ xin việc', 'Văn bằng', 'Y tế'];
      const has = (nv.taiLieu || []).map(t => t.loai);
      return `
      <div class="toolbar"><span class="hint">${(nv.taiLieu || []).length} tài liệu đã đính kèm</span>
        <span class="spacer"></span><button class="btn btn-primary btn-sm" id="fake-upload">⭳ Tải tài liệu lên</button></div>
      ${miniTbl([['Tên tài liệu'], ['Loại hồ sơ'], ['Ngày nộp'], ['Dung lượng'], ['']],
        (nv.taiLieu || []).map(t => [`📎 <b>${esc(t.ten)}</b>`, esc(t.loai), dmy(t.ngay), esc(t.dungLuong),
          '<button class="link-btn" style="font-size:12px">Tải về</button>']), 'Chưa có tài liệu')}
      ${fset('Checklist hồ sơ bắt buộc', `<ul class="list-lite">${need.map(n => `<li>${esc(n)}
        <span class="meta">${has.includes(n) ? '<span class="tag t-green">✓ Đã có</span>' : '<span class="tag t-red">Còn thiếu</span>'}</span></li>`).join('')}</ul>`)}`;
    }

    /* ---- lịch sử ---- */
    case 'lichsu': {
      const ev = [];
      ev.push({ d: nv.ngayVao, t: 'Vào làm việc', s: `${nv.viTri} — ${tenPhong(nv.phongBan)}` });
      (nv.hopDong || []).forEach(h => ev.push({ d: h.tuNgay, t: 'Ký ' + tenHD(h.loai), s: `Số ${h.so} · lương ${money(h.luong)} đ` }));
      (nv.luongSu || []).forEach(x => { if (x.lyDo && x.lyDo.includes('Điều chỉnh')) ev.push({ d: x.tuNgay, t: 'Điều chỉnh lương', s: `${money(x.luongCB)} đ — ${x.lyDo}` }); });
      (nv.dieuChuyen || []).forEach(d => ev.push({ d: d.ngay, t: d.loai, s: `${d.tuPhong} → ${d.denPhong} · ${d.soQD}` }));
      (nv.khenThuong || []).forEach(k => ev.push({ d: k.ngay, t: 'Khen thưởng', s: `${k.noiDung} · ${k.hinhThuc}` }));
      (nv.kyLuat || []).forEach(k => ev.push({ d: k.ngay, t: 'Kỷ luật — ' + k.hinhThuc, s: k.noiDung }));
      if (nv.ngayNghi) ev.push({ d: nv.ngayNghi, t: 'Nghỉ việc', s: nv.lyDoNghi });
      ev.sort((a, b) => String(b.d).localeCompare(String(a.d)));
      return `<div class="panel"><div class="panel-hd"><h3>Dòng thời gian công tác</h3></div>
        <div class="panel-bd"><ul class="timeline">${ev.map(x => `<li>
          <div class="ttl">${esc(x.t)}</div><div class="dt">${dmy(x.d)}</div><div class="ds">${esc(x.s)}</div></li>`).join('')}</ul></div></div>`;
    }
  }
  return '';
}

/* ---------------- modal helper ---------------- */
function modal(title, bodyHtml, footHtml, opts = {}) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="scrim" id="m-scrim"></div>
    <div class="modal ${opts.sm ? 'sm' : ''}" role="dialog">
      <div class="md-hd"><h3>${esc(title)}</h3><span class="spacer"></span>
        <button class="icon-btn" id="m-x" style="font-size:17px">✕</button></div>
      <div class="md-bd">${bodyHtml}</div>
      <div class="md-ft">${footHtml}</div></div>`;
  $('#m-x').onclick = closeModal;
  $('#m-scrim').onclick = closeModal;
}
function closeModal() { $('#modal-root').innerHTML = ''; }

function fld(label, name, opts = {}) {
  const { type = 'text', value = '', req = false, options, wide = false, hint = '' } = opts;
  let input;
  if (options) {
    input = `<select name="${name}">${!req ? '<option value=""></option>' : ''}
      ${options.map(o => {
        const [v, t] = Array.isArray(o) ? o : [o, o];
        return `<option value="${esc(v)}" ${String(value) === String(v) ? 'selected' : ''}>${esc(t)}</option>`;
      }).join('')}</select>`;
  } else if (type === 'textarea') {
    input = `<textarea name="${name}" rows="2">${esc(value)}</textarea>`;
  } else {
    input = `<input type="${type}" name="${name}" value="${esc(value)}">`;
  }
  return `<div class="fld ${wide ? 'wide' : ''}" data-f="${name}">
    <label>${esc(label)}${req ? ' <span class="req">*</span>' : ''}</label>${input}
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ''}<span class="err"></span></div>`;
}
function readForm(sel = '#modal-root') {
  const o = {};
  $$(`${sel} [name]`).forEach(el => { o[el.name] = el.value.trim(); });
  return o;
}
function showErrs(errs) {
  $$('#modal-root .fld').forEach(f => { f.classList.remove('bad'); $('.err', f).textContent = ''; });
  Object.entries(errs).forEach(([k, m]) => {
    const f = $(`#modal-root .fld[data-f="${k}"]`);
    if (f) { f.classList.add('bad'); $('.err', f).textContent = m; }
  });
}

      ${fld('Nơi làm việc', 'noiLamViec', { value: n.noiLamViec || 'Trụ sở Hà Nội', options: ['Trụ sở Hà Nội', 'Chi nhánh TP. HCM', 'Nhà máy Bắc Ninh'] })}

function saveHoSo(id) {
  const d = readForm();
  const errs = {};
  if (!d.ma) errs.ma = 'Bắt buộc';
  else if (S.nv.some(e => e.ma === d.ma && e.id !== id)) errs.ma = 'Mã đã tồn tại';
  if (!d.hoTen) errs.hoTen = 'Bắt buộc';
  if (!d.ngaySinh) errs.ngaySinh = 'Bắt buộc';
  else if (tuoi(d.ngaySinh) < 15) errs.ngaySinh = 'Nhân viên phải từ 15 tuổi';
  if (!d.dienThoai) errs.dienThoai = 'Bắt buộc';
  else if (!/^0\d{9}$/.test(d.dienThoai)) errs.dienThoai = 'SĐT phải gồm 10 số, bắt đầu bằng 0';
  if (!d.email) errs.email = 'Bắt buộc';
  else if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) errs.email = 'Email không hợp lệ';
  else if (S.nv.some(e => e.email === d.email && e.id !== id)) errs.email = 'Email đã được dùng';
  if (d.cccd && !/^\d{12}$/.test(d.cccd)) errs.cccd = 'CCCD gồm 12 chữ số';
  if (!d.phongBan) errs.phongBan = 'Bắt buộc';
  if (!d.viTri) errs.viTri = 'Bắt buộc';
  if (!d.ngayVao) errs.ngayVao = 'Bắt buộc';
  if (!d.luongCB || Number(d.luongCB) <= 0) errs.luongCB = 'Nhập lương > 0';
  if (Object.keys(errs).length) { showErrs(errs); toast('Vui lòng kiểm tra các trường còn lỗi', 'err'); return; }

  if (id) {
    const e = nvById(id);
    Object.assign(e, {
      ma: d.ma, hoTen: d.hoTen, gioiTinh: d.gioiTinh, ngaySinh: d.ngaySinh, cccd: d.cccd,
      noiSinh: d.noiSinh, danToc: d.danToc, honNhan: d.honNhan, dienThoai: d.dienThoai,
      email: d.email, choO: d.choO, phongBan: d.phongBan, viTri: d.viTri, ngayVao: d.ngayVao,
      trangThai: d.trangThai, quanLy: d.quanLy, noiLamViec: d.noiLamViec,
      chucDanh: chucDanhTheoViTri(d.viTri), mst: d.mst, soBHXH: d.soBHXH,
      nganHang: d.nganHang, soTK: d.soTK, chuTK: khongDau(d.hoTen).toUpperCase(),
    });
    if (e.hdHienTai) { e.hdHienTai.loai = d.loaiHD; e.hdHienTai.luong = Number(d.luongCB); e.hdHienTai.kieuLuong = d.kieuLuong; }
    if (e.luongHT) { e.luongHT.luongCB = Number(d.luongCB); e.luongHT.kieu = d.kieuLuong; }
    if (d.trangThai !== 'DNV') { e.ngayNghi = ''; e.lyDoNghi = ''; }
    toast('Đã cập nhật hồ sơ ' + e.hoTen, 'ok');
  } else {
    const lhd = DM.loaiHD.find(h => h.id === d.loaiHD) || DM.loaiHD[0];
    const hd = {
      so: `${d.loaiHD === 'TV' ? 'TV' : 'HĐLĐ'}-${d.ma.slice(-3)}/2026`, loai: d.loaiHD,
      tuNgay: d.ngayVao, denNgay: lhd.thang ? addMonths(d.ngayVao, lhd.thang) : '',
      luong: Number(d.luongCB), kieuLuong: d.kieuLuong, trangThai: 'Đang hiệu lực', nguoiKy: 'Nguyễn Văn An',
    };
    const lg = { tuNgay: d.ngayVao, luongCB: Number(d.luongCB), kieu: d.kieuLuong, phuCap: 0, lyDo: 'Theo hợp đồng lao động' };
    S.nv.push({
      id: 'NV' + Date.now().toString(36).toUpperCase(), ma: d.ma, hoTen: d.hoTen, gioiTinh: d.gioiTinh,
      ngaySinh: d.ngaySinh, noiSinh: d.noiSinh, danToc: d.danToc, tonGiao: 'Không', quocTich: 'Việt Nam',
      honNhan: d.honNhan, cccd: d.cccd, cccdNgayCap: '', cccdNoiCap: '', hoKhau: d.choO, choO: d.choO,
      dienThoai: d.dienThoai, email: d.email, emailCaNhan: '',
      phongBan: d.phongBan, viTri: d.viTri, chucDanh: chucDanhTheoViTri(d.viTri), quanLy: d.quanLy,
      ngayVao: d.ngayVao, trangThai: d.trangThai, ngayNghi: '', lyDoNghi: '',
      noiLamViec: d.noiLamViec, hinhThucLV: 'Hành chính',
      mst: d.mst, soBHXH: d.soBHXH, bhxhTuNgay: addMonths(d.ngayVao, 2),
      mucDongBH: Math.round(Number(d.luongCB) * 0.8), soBHYT: '',
      nganHang: d.nganHang, soTK: d.soTK, chuTK: khongDau(d.hoTen).toUpperCase(),
      hopDong: [hd], hdHienTai: hd, luongSu: [lg], luongHT: lg,
      giaDinh: [], hocVan: [], khenThuong: [], kyLuat: [], dieuChuyen: [], taiLieu: [],
      taiKhoan: 'Chưa kích hoạt', anh: '', ghiChu: '',
    });
    toast('Đã thêm hồ sơ ' + d.hoTen, 'ok');
  }
  save(); closeModal(); render();
  if (S.openId) drawHoSo();
}

/* ---------------- xuất / nhập ---------------- */
function csvCell(v) {
  const s = String(v ?? '');
  return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function doExport(onlySel) {
  const rows = onlySel ? S.nv.filter(e => S.sel.has(e.id)) : filtered();
  if (!rows.length) { toast('Không có hồ sơ nào để xuất', 'err'); return; }
  const cols = COLS.filter(c => S.cols.includes(c.k));
  const head = cols.map(c => c.t);
  const body = rows.map(nv => cols.map(c => {
    const v = colVal(nv, c.k);
    if (c.k === 'ngaySinh' || c.k === 'ngayVao' || c.k === 'hanHD') return dmy(v);
    if (c.k === 'thamNien') return thamNien(nv);
    return v;
  }));
  const csv = '﻿' + [head, ...body].map(r => r.map(csvCell).join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `DanhSachHoSoNhanSu_${rows.length}NV.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast(`Đã xuất ${rows.length} hồ sơ ra file CSV (mở được bằng Excel)`, 'ok');
}

        if (bad.length) errs.push(`Dòng ${i + 2}: ${bad.join(', ')}`);

        ${errs.length ? `<div class="col-pick" style="max-height:120px">${errs.map(e =>
          `<div style="color:var(--red);font-size:12px;padding:2px 0">${esc(e)}</div>`).join('')}</div>` : ''}
        ${parsed.length ? `<div class="tbl-wrap" style="margin-top:8px"><table><thead><tr>
          <th>Mã NV</th><th>Họ và tên</th><th>Phòng ban</th><th>Vị trí</th><th class="num">Lương</th></tr></thead>
          <tbody>${parsed.slice(0, 8).map(p => `<tr><td>${esc(p.ma)}</td><td>${esc(p.hoTen)}</td>
            <td>${esc(tenPhong(p.phongBan))}</td><td>${esc(p.viTri)}</td>
            <td class="num">${money(p.luongCB)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
      $('#imp-ok').disabled = !parsed.length;
    };
    rd.readAsText(f, 'utf-8');
  };

  $('#imp-ok').onclick = () => {
    parsed.forEach(p => {
      const hd = { so: `HĐLĐ-${p.ma.slice(-3)}/2026`, loai: 'TV', tuNgay: p.ngayVao,
        denNgay: addMonths(p.ngayVao || '2026-01-01', 2), luong: p.luongCB, kieuLuong: 'GROSS',
        trangThai: 'Đang hiệu lực', nguoiKy: 'Nguyễn Văn An' };
      const lg = { tuNgay: p.ngayVao, luongCB: p.luongCB, phuCap: 0, kieu: 'GROSS', lyDo: 'Nhập từ Excel' };
      S.nv.push({ id: 'NV' + Math.random().toString(36).slice(2, 9).toUpperCase(), ...p,
        chucDanh: chucDanhTheoViTri(p.viTri), quanLy: '', trangThai: 'TVL', ngayNghi: '', lyDoNghi: '',
        noiSinh: '', danToc: 'Kinh', tonGiao: 'Không', quocTich: 'Việt Nam', honNhan: 'Độc thân',
        cccd: '', cccdNgayCap: '', cccdNoiCap: '', hoKhau: '', choO: '', emailCaNhan: '',
        noiLamViec: 'Trụ sở Hà Nội', hinhThucLV: 'Hành chính', mst: '', soBHXH: '',
        bhxhTuNgay: '', mucDongBH: Math.round(p.luongCB * .8), soBHYT: '', nganHang: '', soTK: '',
        chuTK: khongDau(p.hoTen).toUpperCase(), hopDong: [hd], hdHienTai: hd, luongSu: [lg], luongHT: lg,
        giaDinh: [], hocVan: [], khenThuong: [], kyLuat: [], dieuChuyen: [], taiLieu: [],
        taiKhoan: 'Chưa kích hoạt', anh: '', ghiChu: '' });
    });
    save(); const n = parsed.length; closeModal(); render();
    toast(`Đã nhập thành công ${n} hồ sơ`, 'ok');
  };
}

/* ---------------- xóa ---------------- */
function delNV(id) {
  const e = nvById(id);
  if (!confirm(`Xóa hồ sơ "${e.hoTen}" (${e.ma})?\n\nThao tác này không thể hoàn tác.`)) return;
  S.nv = S.nv.filter(x => x.id !== id);
  S.duyet = S.duyet.filter(d => d.nvId !== id);
  S.sel.delete(id);
  if (S.openId === id) closeHoSo();
  save(); render(); toast('Đã xóa hồ sơ ' + e.hoTen, 'ok');
}
function delBulk() {
  const n = S.sel.size;
  if (!confirm(`Xóa ${n} hồ sơ đã chọn?\n\nThao tác này không thể hoàn tác.`)) return;
  S.nv = S.nv.filter(e => !S.sel.has(e.id));
  S.duyet = S.duyet.filter(d => !S.sel.has(d.nvId));
  S.sel.clear(); save(); render(); toast(`Đã xóa ${n} hồ sơ`, 'ok');
}

/* ---------------- duyệt hồ sơ ---------------- */
function approve(id, ok) {
  const d = S.duyet.find(x => x.id === id); if (!d) return;
  if (ok) {
    const e = nvById(d.nvId);
    if (e) e[d.truong] = d.giaTriMoi;
    d.trangThai = 'Đã duyệt';
    toast(`Đã duyệt: ${d.nhanTruong} của ${d.nvTen}`, 'ok');
  } else { d.trangThai = 'Từ chối'; toast('Đã từ chối yêu cầu', ''); }
  save(); render();
}

/* ---------------- event binding ---------------- */
function bindGlobal() {
  document.addEventListener('click', ev => {
    const t = ev.target;
    const hit = s => t.closest(`[${s}]`);

    // mở hồ sơ
    const o = hit('data-open'); if (o) { openHoSo(o.getAttribute('data-open')); return; }
    const ed = hit('data-edit'); if (ed) { formHoSo(ed.getAttribute('data-edit')); return; }
    const dl = hit('data-del'); if (dl) { delNV(dl.getAttribute('data-del')); return; }

    // form con trong hồ sơ
    for (const [attr, kind] of [['data-addhd', 'hd'], ['data-addluong', 'luong'], ['data-addgd', 'gd'],
      ['data-addhv', 'hv'], ['data-addkt', 'kt'], ['data-addkl', 'kl'], ['data-adddc', 'dc']]) {
      const b = hit(attr); if (b) { formSub(kind, b.getAttribute(attr)); return; }
    }

    // drawer
    if (t.id === 'scrim' || t.id === 'dw-close') { closeHoSo(); return; }
    if (t.id === 'dw-print') { window.print(); return; }
    const tb = hit('data-tab');
    if (tb) {
      S.tab = tb.getAttribute('data-tab');
      $$('.dw-tabs button').forEach(b => b.classList.toggle('on', b.getAttribute('data-tab') === S.tab));
      $('#dw-bd').innerHTML = tabHtml(nvById(S.openId));
      $('#dw-bd').scrollTop = 0;
      return;
    }
    if (t.id === 'fake-upload') { toast('(Demo) Chức năng tải tệp chưa kết nối máy chủ', ''); return; }

    // điều hướng / lọc nhanh
    const gt = hit('data-goto'); if (gt) { go(gt.getAttribute('data-goto')); return; }
    const dp = hit('data-dept'); if (dp) { S.f.phongBan = dp.getAttribute('data-dept'); S.page = 1; go('hoso'); return; }

    // toolbar danh sách
    if (t.id === 'btn-add') { formHoSo(null); return; }
    if (t.id === 'btn-cols') { formCols(); return; }
    if (t.id === 'btn-more-filter') { formFilter(); return; }
    if (t.id === 'btn-import') { formImport(); return; }
    if (t.id === 'btn-export') { doExport(false); return; }
    const md = hit('data-mode'); if (md) { S.mode = md.getAttribute('data-mode'); render(); return; }

    // sort / phân trang
    const so = hit('data-sort');
    if (so) {
      const k = so.getAttribute('data-sort');
      S.sort = { k, dir: S.sort.k === k ? -S.sort.dir : 1 };
      render(); return;
    }
    const pg = hit('data-pg');
    if (pg && !pg.disabled) { S.page = Number(pg.getAttribute('data-pg')); render(); return; }

    // chip lọc
    const cf = hit('data-clearf');
    if (cf) { S.f[cf.getAttribute('data-clearf')] = ''; S.page = 1; render(); return; }
    if (t.id === 'clear-all-f' || t.id === 'clear-all-f2') {
      S.f = { phongBan: '', viTri: '', trangThai: '', loaiHD: '', gioiTinh: '', chucDanh: '', vaoTu: '', vaoDen: '' };
      S.q = ''; S.page = 1; render(); return;
    }

    // hàng loạt
    if (t.id === 'bulk-edit') { formBulk(); return; }
    if (t.id === 'bulk-contract') { formBulkHD(); return; }
    if (t.id === 'bulk-acc') { formAcc(); return; }
    if (t.id === 'bulk-mail') { formMail(); return; }
    if (t.id === 'bulk-merge') { formMerge(); return; }
    if (t.id === 'bulk-export') { doExport(true); return; }
    if (t.id === 'bulk-del') { delBulk(); return; }
    if (t.id === 'bulk-clear') { S.sel.clear(); render(); return; }

    // duyệt
    const ap = hit('data-approve'); if (ap) { approve(ap.getAttribute('data-approve'), true); return; }
    const rj = hit('data-reject'); if (rj) { approve(rj.getAttribute('data-reject'), false); return; }
    if (t.id === 'approve-all') {
      if (!confirm('Duyệt tất cả yêu cầu đang chờ?')) return;
      S.duyet.filter(d => d.trangThai === 'Chờ duyệt').forEach(d => {
        const e = nvById(d.nvId); if (e) e[d.truong] = d.giaTriMoi; d.trangThai = 'Đã duyệt';
      });
      save(); render(); toast('Đã duyệt tất cả yêu cầu', 'ok'); return;
    }
  });

  // checkbox chọn dòng
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'chk-all') {
      const rows = filtered().slice((S.page - 1) * S.perPage, S.page * S.perPage);
      rows.forEach(e => t.checked ? S.sel.add(e.id) : S.sel.delete(e.id));
      render(); return;
    }
    if (t.classList.contains('chk')) {
      const id = t.getAttribute('data-id');
      t.checked ? S.sel.add(id) : S.sel.delete(id);
      render(); return;
    }
    if (t.id === 'per-page') { S.perPage = Number(t.value); S.page = 1; render(); return; }
    const m = /^f-(\w+)$/.exec(t.id || '');
    if (m) { S.f[m[1]] = t.value; S.page = 1; render(); return; }
  });

  // tìm kiếm (debounce)
  let tmr;
  document.addEventListener('input', ev => {
    if (ev.target.id !== 'q') return;
    clearTimeout(tmr);
    const v = ev.target.value;
    tmr = setTimeout(() => {
      S.q = v; S.page = 1;
      render();
      const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(v.length, v.length); }
    }, 220);
  });

  // ESC đóng
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape') return;
    if ($('#modal-root').innerHTML) closeModal();
    else if (S.openId) closeHoSo();
  });
}

</script>
