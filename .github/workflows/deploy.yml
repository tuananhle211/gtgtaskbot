name: Deploy to VPS

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/gtgtask
            git fetch origin
            git reset --hard origin/master
            docker compose --profile web --profile tunnel build
            docker compose --profile web --profile tunnel up -d

  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_DEV_USERNAME }}
          password: ${{ secrets.VPS_DEV_PASSWORD }}
          port: ${{ secrets.VPS_DEV_PORT }}
          script: |
            cd /root/gtgtask
            git fetch origin
            git reset --hard origin/dev
            docker compose --profile web --profile tunnel build
            docker compose --profile web --profile tunnel up -d
