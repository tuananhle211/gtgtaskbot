name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_DEV_HOST }}
          username: ${{ secrets.VPS_DEV_USERNAME }}
          password: ${{ secrets.VPS_DEV_PASSWORD }}
          port: ${{ secrets.VPS_DEV_PORT }}
          script: |
            cd /root/gtgtask
            git fetch origin
            git reset --hard origin/master
            docker compose --profile web --profile tunnel build
            docker compose --profile web --profile tunnel up -d
